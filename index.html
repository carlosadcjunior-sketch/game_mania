<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Mania - E-commerce Gamer & Tech</title>
    <style>
        :root {
            --bg-body: #0a0e17;
            --bg-surface: #111827;
            --bg-card: #1f2937;
            --border-ui: #374151;
            --border-highlight: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.25);
            --accent-orange: #f59e0b;
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* HEADER / TOPO */
        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-ui);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-top {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: grid;
            grid-template-columns: 2fr 4fr 3fr;
            align-items: center;
            gap: 1.5rem;
        }

        .brand-block {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .store-tag {
            font-size: 0.75rem;
            color: var(--accent-green);
            font-weight: 600;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-green);
        }

        /* BUSCA PREDITIVA */
        .search-block {
            position: relative;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 8px;
            padding: 0.65rem 1rem 0.65rem 2.5rem;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-suggestions {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 8px;
            overflow: hidden;
            display: none;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .suggestion-item {
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.2s;
        }

        .suggestion-item:hover {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
        }

        /* AÇÕES DO USUÁRIO */
        .user-actions-block {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1rem;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-ui);
            color: var(--text-main);
            padding: 0.5rem 0.9rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .btn-action:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background-color: rgba(16, 185, 129, 0.05);
        }

        .btn-cart {
            background-color: var(--accent-green);
            color: #0a0e17;
            border-color: var(--accent-green);
        }

        .btn-cart:hover {
            filter: brightness(1.1);
            color: #0a0e17;
            background-color: var(--accent-green);
        }

        /* CATEGORIAS EM CÍRCULOS */
        .nav-categories-bar {
            background-color: var(--bg-body);
            border-top: 1px solid var(--border-ui);
            padding: 0.75rem 1rem;
        }

        .nav-categories-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            overflow-x: auto;
        }

        .category-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            color: var(--text-muted);
            min-width: 80px;
            transition: color 0.2s;
        }

        .category-circle-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.2s;
        }

        .category-node:hover .category-circle-icon {
            border-color: var(--accent-green);
            background-color: rgba(16, 185, 129, 0.1);
            transform: translateY(-2px);
        }

        .category-node:hover .category-label {
            color: var(--accent-green);
        }

        .category-label {
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* CONTEÚDO PRINCIPAL (GRID 12 COLUNAS) */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
            flex: 1;
        }

        /* BANNERS */
        .banner-box {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-ui);
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .banner-company {
            grid-column: span 7;
        }

        .banner-promo {
            grid-column: span 5;
        }

        .badge-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
        }

        .badge-green {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-orange {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .banner-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .banner-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* SEÇÃO TÍTULO */
        .section-header {
            grid-column: span 12;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 1rem;
            border-bottom: 1px solid var(--border-ui);
            padding-bottom: 0.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* CARDS DE PRODUTOS COM SHORTS */
        .product-card {
            grid-column: span 3;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-ui);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-green);
        }

        .product-media {
            background-color: var(--bg-card);
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid var(--border-ui);
            color: var(--text-muted);
        }

        .short-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0.6);
            border: 1px solid var(--border-ui);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--accent-green);
            font-weight: 600;
        }

        .product-media-icon {
            font-size: 2.5rem;
            margin-bottom: 0.25rem;
        }

        .product-info {
            padding: 1.25
