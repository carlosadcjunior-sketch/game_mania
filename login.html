<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Mania - Login / Acesso à Conta</title>
    <style>
        :root {
            --bg-body: #0a0e17;
            --bg-surface: #111827;
            --bg-card: #1f2937;
            --border-ui: #374151;
            --border-highlight: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.25);
            --accent-orange: #f59e0b;
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            line-height: 1.5;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-ui);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-green);
        }

        .back-home {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-home:hover {
            color: var(--accent-green);
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem 1rem;
            flex: 1;
        }

        .login-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-ui);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .forgot-pass {
            color: var(--accent-green);
            text-decoration: none;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-green);
            color: #0a0e17;
            font-weight: 700;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: filter 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .login-footer-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .login-footer-text a {
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer-text a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--bg-card);
            border: 1px solid var(--accent-green);
            color: var(--text-main);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
            font-size: 0.9rem;
        }

        footer {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-ui);
            text-align: center;
            padding: 1.25rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">GAME <span>MANIA</span></a>
        <a href="index.html" class="back-home">← Voltar para a Loja</a>
    </header>

    <main>
        <div class="login-card">
            <div class="login-header">
                <h1>Área do Cliente</h1>
                <p>Faça login para acompanhar seus pedidos e ofertas</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">E-mail Cadastrado</label>
                    <input type="email" id="email" class="form-control" placeholder="seu.email@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-actions-row">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember"> Lembrar de mim
                    </label>
                    <a href="#" class="forgot-pass" onclick="showToast('Instruções enviadas para o e-mail cadastrado!')">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-submit">Entrar na Conta</button>
            </form>

            <div class="login-footer-text">
                Ainda não tem uma conta? <a href="#">Cadastre-se</a>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <footer>
        © 2026 Game Mania E-commerce Ltda. Todos os direitos reservados.
    </footer>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            
            showToast(`Login realizado com sucesso! Bem-vindo(a), ${email}`);
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
